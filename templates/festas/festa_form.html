{% extends 'base.html' %}

{% block title %}{% if object %}Editar festa{% else %}Nova festa{% endif %} - Sua Festa{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">{% if object %}Editar festa{% else %}Nova festa{% endif %}</h1>
  <form method="post" class="col-lg-8 p-0">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a class="btn btn-outline-secondary"
       href="{% if object %}{% url 'festas:festa_detalhe' object.pk %}{% else %}{% url 'festas:festa_lista' %}{% endif %}">Cancelar</a>
  </form>
{% endblock %}
