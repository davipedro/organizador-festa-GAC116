{% extends 'base.html' %}

{% block title %}Confirmar exclusão - Sua Festa{% endblock %}

{% block content %}
  <div class="cartao-auth">
    <div class="card border-danger">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Excluir {{ objeto }}?</h1>
        {% if aviso %}
          <div class="alert alert-warning" role="alert">{{ aviso }}</div>
        {% endif %}
        <p class="text-body-secondary">Essa ação não pode ser desfeita.</p>
        <form method="post" class="d-flex flex-wrap gap-2 m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sim, excluir</button>
          <a class="btn btn-outline-secondary" href="{{ cancelar_url }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
