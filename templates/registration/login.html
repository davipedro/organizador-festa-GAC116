{% extends 'base.html' %}

{% block title %}Entrar - Sua Festa{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">Entrar</h1>
  <form method="post" class="col-md-6 col-lg-4 p-0">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>
  <p class="mt-3">
    Ainda não tem conta? <a href="{% url 'contas:cadastro' %}">Cadastre-se</a>
  </p>
{% endblock %}
