{% extends 'base.html' %}

{% block title %}Entrar - Sua Festa{% endblock %}

{% block content %}
  <div class="cartao-auth">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Entrar</h1>
        <p class="text-body-secondary mb-4">Organize suas festas, convidados e tarefas.</p>
        <form method="post" class="form-auth">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
    <p class="mt-3 text-center">
      Ainda não tem conta? <a href="{% url 'contas:cadastro' %}">Cadastre-se</a>
    </p>
  </div>
{% endblock %}
