{% extends 'base.html' %}

{% block title %}Cadastre-se - Sua Festa{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">Cadastre-se</h1>
  <form method="post" class="col-md-6 col-lg-4 p-0">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Criar conta</button>
  </form>
  <p class="mt-3">
    Já tem conta? <a href="{% url 'contas:login' %}">Entrar</a>
  </p>
{% endblock %}
