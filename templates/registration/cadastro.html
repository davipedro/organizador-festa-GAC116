{% extends 'base.html' %}

{% block title %}Cadastre-se - Sua Festa{% endblock %}

{% block content %}
  <div class="cartao-auth">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h3 mb-1">Cadastre-se</h1>
        <p class="text-body-secondary mb-4">Crie sua conta e comece a organizar suas festas.</p>
        <form method="post" class="form-auth">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100">Criar conta</button>
        </form>
      </div>
    </div>
    <p class="mt-3 text-center">
      Já tem conta? <a href="{% url 'contas:login' %}">Entrar</a>
    </p>
  </div>
{% endblock %}
